name: daily

# 工作日纽约时间 17:00 在美国机房拉 CCC 利差与纳指 → 重算 → 把 data/、信号快照.csv、ci_status.json 提交回 main。
# 本地双击「更新并打开.command」会先 git pull，所以本机连不上 FRED 时也能拿到这里更新好的数据。
#
# FRED_API_KEY 放在仓库 Settings → Secrets and variables → Actions（2026-10-23 配好）。
# 必须有：2026-10-23 实测 GitHub 机房上 FRED 网页下载会被断开、Yahoo 返回 429，只有官方 API 能用。
on:
  schedule:
    # 工作日纽约时间 17:00。GitHub 的定时只认 UTC，夏令时 17:00 = 21:00 UTC，冬令时 = 22:00 UTC，
    # 两条都挂上，由下面的 check 按当天纽约是否夏令时只放行对的那一条（GitHub 常晚到，所以按触发的是哪条判断，不按到达时刻）。
    # 注意：17:00 时 FRED 一般还没有当天的数据（ICE 利差次日才发布，NASDAQCOM 也常要到次日），这次跑多半拿到的是前一交易日。
    - cron: "0 21 * * 1-5"
    - cron: "0 22 * * 1-5"
  # 改了代码就跑一次（机器人提交的数据文件与文档不触发；GITHUB_TOKEN 的推送本来也不会再触发工作流）
  push:
    branches: [main]
    paths-ignore: ["**.md", "data/**", "信号快照.csv", "ci_status.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(TZ=America/New_York date +%Z)" = "EDT" ]; then want="0 21 * * 1-5"; else want="0 22 * * 1-5"; fi
            [ "$CRON" = "$want" ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "触发：${{ github.event_name }} ${CRON}；纽约现在 $(TZ=America/New_York date '+%F %H:%M %Z')；执行：$go"

  update:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自检
        run: python3 test_signals.py
      - name: 下载并重算
        env:
          CCC_SNAPSHOT: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 update.py --ci
      # ci_status.json 每次都提交（下载失败也提交），记下每个来源成功与否、失败原因——Actions 日志之外留一份可查的诊断
      - name: 提交数据、快照与运行状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/
          [ -f 信号快照.csv ] && git add 信号快照.csv
          git add ci_status.json
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          AS_OF=$(python3 -c 'import json; print(json.load(open("ci_status.json"))["as_of"])')
          git commit -m "数据更新：${AS_OF}"
          for k in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((k * 5))
          done
          exit 1
      - name: 下载有失败则标红
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open("ci_status.json"))["fetch"]
          bad = {k: v.get("error") for k, v in s.items() if not v.get("ok")}
          for k, e in bad.items():
              print("::error::%s 下载失败：%s" % (k, e))
          sys.exit(1 if bad else 0)
          PY
