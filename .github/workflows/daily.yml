name: daily

# 每个美股交易日的次日从 FRED 拉 CCC 利差与纳指 → 重算 → 把 data/ 与 信号快照.csv 提交回 main。
# 本地双击「更新并打开.command」时会先 git pull，拿到这里更新过的 data/。
on:
  schedule:
    # 13:37 UTC = 北京 21:37 = 美东 09:37（夏令时）/ 08:37（冬令时）。ICE 利差在 FRED 上一般晚一天发布，
    # 这时前一交易日的数已齐。周二到周六各跑一次，正好覆盖周一到周五。分钟取 37 避开整点排队。
    - cron: "37 13 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自检
        run: python3 test_signals.py
      - name: 下载并重算
        env:
          CCC_SNAPSHOT: "1"
        run: python3 update.py --ci
      - name: 提交数据与快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/ 信号快照.csv 2>/dev/null || git add data/
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          AS_OF=$(python3 -c 'import json; print(json.load(open("status.json"))["as_of"])')
          git commit -m "数据更新：${AS_OF}"
          for k in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((k * 5))
          done
          exit 1
